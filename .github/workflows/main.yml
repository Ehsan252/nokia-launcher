name: Build Android TV Launcher

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Clean Project
        run: |
          mkdir -p main_project/app/src/main/java/com/cleanyourtv/launcher
          
          # Wir suchen die hochgeladene MainActivity.java und kopieren sie an die richtige Stelle
          find . -name "MainActivity.java" -exec cp {} main_project/app/src/main/java/com/cleanyourtv/launcher/MainActivity.java \;
          
          # Wir schreiben die Konfigurationsdateien direkt frisch und fehlerfrei rein
          cat << 'EOF' > main_project/settings.gradle
          rootProject.name = "NokiaLauncher"
          include ':app'
          EOF

          cat << 'EOF' > main_project/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.cleanyourtv.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.cleanyourtv.launcher"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > main_project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com" package="com.cleanyourtv.launcher">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application android:label="CleanYourTV Launcher" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleInstance">
                      <intent-filter android:priority="2">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Gradle Wrapper anlegen
          cd main_project
          gradle wrapper --gradle-version 8.2

      - name: Build Debug APK
        run: |
          cd main_project
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: main_project/app/build/outputs/apk/debug/app-debug.apk
